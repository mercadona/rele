name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    # A full job takes well under a minute; anything near this is hung, not slow.
    # Without it the default is 6 hours, which is how long a stuck codecov upload
    # held a runner on the 1.17.2 release PR.
    timeout-minutes: 15

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up uv with Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Linting
        run: make lint

      - name: Type checking
        run: make typecheck

      - name: Coverage
        run: |
          make coverage
          uv run codecov


